        <div class="post-body"><h1>闲话</h1>
<p>最近几天都过着日夜颠倒的生活，不过晚上干活的感觉确实很好，夜深人静的时候灵感很多，效率也很高，但是感觉太伤身体了，再加上一早上打开手机看着30几条的微信红点，感觉整个人和周围是隔绝开来的，以后不能再这样继续下去了。</p>
<p>我记得我和好几个人都这样承诺过，但是该熬夜还是熬夜呢，真是死性不改，唉</p>
