{{ define "main" }}
{{ $isTag := eq .Data.Singular "tag" }}
<div class="frame index">
  <header class="index-head">
    <h1 class="display index-term">{{ .Title }}<sup class="index-count mono">{{ len .Pages }}</sup></h1>
    <p class="index-sub label">
      {{ with .Parent }}
        <a class="wipe" href="{{ .RelPermalink }}">← {{ if $isTag }}全部标签{{ else }}全部分类{{ end }}</a>
      {{ end }}
    </p>
  </header>
  <section class="index-group grid">
    <ol class="index-list">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-row.html" (dict "page" . "fmt" "2006.01.02") }}
      {{ end }}
    </ol>
  </section>
</div>
{{ end }}
