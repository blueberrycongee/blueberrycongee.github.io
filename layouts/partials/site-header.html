{{ $writing := or (eq .Section "posts") (in (slice "taxonomy" "term") .Kind) }}
<header class="site-header">
  <a class="mark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.author }} — 首页">
    <span class="mark-en" lang="en">Jiahe Wu</span>
    <span class="mark-zh">{{ site.Params.author }}</span>
  </a>
  <nav class="site-nav label" aria-label="主导航" lang="en">
    <a class="wipe" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Photos</a>
    {{ with site.GetPage "/posts" }}
      <a class="wipe" href="{{ .RelPermalink }}"{{ if $writing }} aria-current="page"{{ end }}>Writing</a>
    {{ end }}
    {{ with site.GetPage "/about" }}
      <a class="wipe" href="{{ .RelPermalink }}"{{ if eq $.RelPermalink .RelPermalink }} aria-current="page"{{ end }}>About</a>
    {{ end }}
    <button class="theme-toggle" data-theme-toggle type="button" aria-label="切换明暗主题" aria-pressed="false"><span aria-hidden="true"></span></button>
  </nav>
</header>
