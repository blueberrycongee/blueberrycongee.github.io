{{ if not .IsHome }}
<footer class="site-footer">
  {{ partial "roll.html" . }}
  <div class="footer-bar label">
    <p>© {{ now.Year }} {{ site.Params.author }}</p>
    <nav class="footer-links" aria-label="页脚链接" lang="en">
      <a class="wipe" href="{{ site.Params.github }}" rel="me noopener" target="_blank">GitHub ↗</a>
      <a class="wipe" href="mailto:{{ site.Params.email }}">Email</a>
      <a class="wipe" href="{{ site.Home.RelPermalink }}index.xml">RSS</a>
    </nav>
  </div>
</footer>
{{ end }}
