{{ define "main" }}
{{ $isTag := eq .Data.Singular "tag" }}
<div class="frame index">
  <header class="index-head">
    <h1 class="display" lang="en">{{ if $isTag }}Tags{{ else }}Categories{{ end }}<sup class="index-count mono">{{ len .Data.Terms }}</sup></h1>
    <p class="index-sub label">
      <a class="wipe" href="{{ "/posts/" | relLangURL }}">← 全部文章</a>
    </p>
  </header>
  <ol class="term-cloud">
    {{ range .Data.Terms.ByCount }}
      <li>
        <a class="term-chip" href="{{ .Page.RelPermalink }}">
          <span class="term-name">{{ .Page.Title }}</span><sup class="term-count mono">{{ .Count }}</sup>
        </a>
      </li>
    {{ end }}
  </ol>
</div>
{{ end }}
