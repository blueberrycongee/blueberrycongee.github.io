{{ define "main" }}
{{ $isTag := eq .Data.Singular "tag" }}
<div class="container posts-archive">
  <header class="page-head">
    <p class="section-label">{{ if $isTag }}Tags{{ else }}Categories{{ end }}</p>
    <h1 class="page-title">{{ if $isTag }}标签{{ else }}分类{{ end }}</h1>
    <p class="page-sub mono muted">{{ len .Pages }} 个</p>
  </header>
  <ul class="term-cloud">
    {{ range .Data.Terms.ByCount }}
      <li>
        <a class="term-pill" href="{{ .Page.RelPermalink }}">
          {{ if $isTag }}<span class="term-hash" aria-hidden="true">#</span>{{ end -}}
          <span class="term-name">{{ .Page.Title }}</span>
          <span class="term-count mono">{{ .Count }}</span>
        </a>
      </li>
    {{ end }}
  </ul>
</div>
{{ end }}
