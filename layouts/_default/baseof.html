<!doctype html>
<html lang="zh-CN" class="no-js" data-theme="dark">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}home{{ else }}sub{{ end }}">
    <a class="skip-link" href="#main">跳到正文</a>
    {{ partial "site-header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "site-footer.html" . }}
    {{ $js := resources.Match "js/*.js" | resources.Concat "js/bundle.js" | minify | fingerprint "sha512" }}
    <script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
  </body>
</html>
