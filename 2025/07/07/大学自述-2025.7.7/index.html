          <h1>大学自述 · 2025.7.7</h1>
          <p>记录一下生日那天，我下午因为礼物的事情哭到泣不成声</p>
<p>我现在又有点难过，但是我在图书馆，哭不出来，我想到你那天我答应分手，你却哭到失声，你说明明这是你一直想要的结果，和我分开，但是为什么这么痛，心这么痛。</p>
<p>我每次想到这个都很想哭，特别是你现在也没有幸福，我真的听到这些还是会心痛，我当时听到有点愣神，随即就是难过，我真的不知道说什么才好。</p>
